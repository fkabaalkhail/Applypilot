name: Scrape Jobs

on:
  schedule:
    # Hourly. A run costs the database well under 1 MB: every dedup site is a
    # column query (`SELECT scraped_jobs.url`), verified against prod.
    #
    # The Neon transfer overage was never this workflow. It was a stale
    # resumate-scraper deployment connecting straight to Neon with the DB
    # password, running a pre-2026-05-11 ScrapedJob model whose dedup fetched
    # whole rows -- ~6,000 x ~2.3 KB = ~14 MB every hour. Killed on 2026-07-13
    # by rotating the neondb_owner password; it had also been the source of
    # ~all new jobs since 2026-06-26, so cron-ats now carries the feed.
    # Minute 17, not 0: GitHub fires scheduled workflows on a shared queue and
    # top-of-hour is its most contended slot -- fires there get delayed or
    # silently dropped (observed: the 00:00Z and 02:00Z fires on 2026-07-13
    # never ran at all). An off-peak minute makes the hourly cadence real.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # JobSpy + LinkedIn were parked from e1177e6 until the batched ingest
      # endpoint existed: they used to POST /jobs/create once per job with no
      # auth, and every request 401'd. They now collect everything and POST
      # /jobs/ingest-batch in chunks of 100 with the cron secret — a handful
      # of authenticated requests per run instead of thousands of dead ones.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install python-jobspy httpx
      - name: Run JobSpy scraper (Indeed + LinkedIn)
        run: python scripts/scrape_jobspy.py
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Run LinkedIn guest API scraper
        run: python scripts/scrape_linkedin.py
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Trigger ATS scraper
        run: |
          curl -X POST "https://www.tailrd.ca/github-sources/cron-ats" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 || true

      - name: Trigger GitHub aggregator
        run: |
          curl -X POST "https://www.tailrd.ca/github-sources/cron-poll" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 || true
