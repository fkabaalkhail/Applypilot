name: Scrape Jobs

on:
  schedule:
    # Temporarily every 6h, not hourly, while the Neon network-transfer overage
    # is still unexplained (the project sat at ~97% of its monthly allowance).
    #
    # Measured since: a run costs the DB well under 1 MB. Every dedup site is a
    # column query, confirmed against prod -- cron-ats issued 1,486 and cron-poll
    # 593 `SELECT scraped_jobs.url` and no whole-row fetches. So the scrape run
    # is NOT the source of the overage, and restoring the hourly cron is likely
    # safe; it stays at 6h only until the real source is identified.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-jobspy httpx

      - name: Run JobSpy scraper (Indeed + LinkedIn)
        run: python scripts/scrape_jobspy.py
        continue-on-error: true

      - name: Run LinkedIn guest API scraper
        run: python scripts/scrape_linkedin.py
        continue-on-error: true

      - name: Trigger ATS scraper
        run: |
          curl -X POST "https://www.tailrd.ca/github-sources/cron-ats" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 || true

      - name: Trigger GitHub aggregator
        run: |
          curl -X POST "https://www.tailrd.ca/github-sources/cron-poll" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 || true
